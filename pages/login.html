<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — DelegateIQ</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .auth-card{overflow:hidden}
    .btn-loading{opacity:0.7;cursor:not-allowed;pointer-events:none}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body class="auth-page">
  <div class="auth-container">
    <a href="../index.html" class="auth-logo-centered">
      <div class="logo-mark">D</div>
      <span class="logo-text">DelegateIQ</span>
    </a>
    <div class="auth-card">
      <div class="auth-toggle-row">
        <a href="login.html" class="auth-toggle active">Sign In</a>
        <a href="signup.html" class="auth-toggle">Sign Up</a>
      </div>
      <h2 class="auth-title">Welcome back 👋</h2>
      <p class="auth-sub">Sign in to continue your delegate journey</p>
      <div class="auth-error" id="authError"></div>
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@college.edu" required autocomplete="email"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-pw-wrap">
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"/>
            <button type="button" class="toggle-pw" onclick="togglePw()">👁</button>
          </div>
        </div>
        <div class="form-row-space">
          <label class="checkbox-label"><input type="checkbox"/> Remember me</label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn-primary btn-full" id="loginBtn">Sign In →</button>
      </form>
      <div class="auth-divider"><span>or</span></div>
      <button class="google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up free</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCqNmnpQRg5uUYu4Pp_k0k90wNBmJxpuH0",
      authDomain: "delegate-iq-2025.firebaseapp.com",
      projectId: "delegate-iq-2025",
      storageBucket: "delegate-iq-2025.firebasestorage.app",
      messagingSenderId: "612696020579",
      appId: "1:612696020579:web:90255861a0d531f2580a56"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'dashboard.html';
    });

    let isSubmitting = false;

    function setLoading(loading) {
      isSubmitting = loading;
      const btn = document.getElementById('loginBtn');
      const gBtn = document.getElementById('googleBtn');
      if (loading) {
        btn.innerHTML = '<span class="spinner"></span>Signing in...';
        btn.classList.add('btn-loading');
        gBtn.disabled = true;
      } else {
        btn.innerHTML = 'Sign In →';
        btn.classList.remove('btn-loading');
        gBtn.disabled = false;
      }
    }

    function showError(msg) {
      const el = document.getElementById('authError');
      el.textContent = msg;
      el.classList.add('show');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isSubmitting) return;
      setLoading(true);
      try {
        const cred = await auth.signInWithEmailAndPassword(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        // Restore profile from Firebase if localStorage is empty
        const stored = localStorage.getItem('diq_profile');
        if (!stored || stored === '{}') {
          const user = cred.user;
          const parts = (user.displayName || user.email.split('@')[0]).split(' ');
          localStorage.setItem('diq_profile', JSON.stringify({
            uid: user.uid,
            displayName: user.displayName || parts[0],
            firstName: parts[0],
            lastName: parts.slice(1).join(' '),
            email: user.email,
            school: '',
            initials: (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase(),
            badges: ['first_login'],
            conferences: [],
            researchCount: 0
          }));
        }
        window.location.href = 'dashboard.html';
      } catch (err) {
        setLoading(false);
        const msgs = {
          'auth/user-not-found': '⚠️ No account with this email. Sign up first!',
          'auth/wrong-password': '⚠️ Wrong password. Try again.',
          'auth/invalid-credential': '⚠️ Wrong email or password. Try again.',
          'auth/invalid-email': '⚠️ Please enter a valid email.',
          'auth/too-many-requests': '⚠️ Too many failed attempts. Wait a moment.',
          'auth/network-request-failed': '⚠️ No internet connection.',
        };
        showError(msgs[err.code] || '⚠️ ' + err.message);
      }
    });

    document.getElementById('googleBtn').addEventListener('click', async () => {
      if (isSubmitting) return;
      setLoading(true);
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const cred = await auth.signInWithPopup(provider);
        const user = cred.user;
        const stored = localStorage.getItem('diq_profile');
        if (!stored || stored === '{}') {
          const parts = (user.displayName || 'Delegate').split(' ');
          localStorage.setItem('diq_profile', JSON.stringify({
            uid: user.uid,
            displayName: user.displayName || 'Delegate',
            firstName: parts[0],
            lastName: parts.slice(1).join(' '),
            email: user.email,
            school: '',
            initials: (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase(),
            badges: ['first_login'],
            conferences: [],
            researchCount: 0
          }));
        }
        window.location.href = 'dashboard.html';
      } catch (err) {
        setLoading(false);
        if (err.code !== 'auth/popup-closed-by-user') {
          showError('⚠️ Google sign-in failed. Try again.');
        }
      }
    });

    window.togglePw = function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
      document.querySelector('.toggle-pw').textContent = input.type === 'password' ? '👁' : '🔒';
    };
  </script>
</body>
</html>
